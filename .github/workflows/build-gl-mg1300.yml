name: Build GL-MG1300 image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Fork tags may be stale; take release tags from upstream.
      - name: Determine version
        id: version
        run: |
          git fetch --force https://github.com/openwrt/openwrt.git 'refs/tags/v25.12*:refs/tags/v25.12*'
          version=$(git describe --tags --abbrev=0 --match 'v25.12*' HEAD)
          echo "tag=${version}-$(git rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ github.run_id }}
          restore-keys: dl-

      - name: Restore host tools and toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            staging_dir/host
            build_dir/host
            staging_dir/toolchain-*
            build_dir/toolchain-*
          key: toolchain-ramips-mt7621-${{ hashFiles('tools/**', 'toolchain/**', 'include/kernel-*', 'rules.mk') }}

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_glinet_gl-mg1300=y
          CONFIG_PACKAGE_luci=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          EOF
          make defconfig

      - name: Download sources
        run: make download -j8

      # Checkout gives sources fresh mtimes; make cached stamps newer so tools/toolchain aren't rebuilt.
      - name: Refresh cached stamps
        run: |
          find build_dir/host staging_dir/host/stamp build_dir/toolchain-* staging_dir/toolchain-*/stamp \
            -type f -empty -exec touch {} + 2>/dev/null || true

      - name: Build
        run: make -j$(nproc) || make -j1 V=s

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: GL-MG1300 ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            bin/targets/ramips/mt7621/*glinet_gl-mg1300-squashfs-sysupgrade.bin
            bin/targets/ramips/mt7621/*glinet_gl-mg1300-initramfs-kernel.bin
            bin/targets/ramips/mt7621/*glinet_gl-mg1300.manifest
            bin/targets/ramips/mt7621/config.buildinfo
            bin/targets/ramips/mt7621/feeds.buildinfo
            bin/targets/ramips/mt7621/version.buildinfo
            bin/targets/ramips/mt7621/profiles.json
            bin/targets/ramips/mt7621/sha256sums
          fail_on_unmatched_files: true
